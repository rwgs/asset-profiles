name: Validate PR

on:
  # This is the only automated check the repository has, and it had never run
  # on this fork: it fires on `pull_request` alone, while work here lands on
  # `main` directly. `workflow_dispatch` makes the gate runnable against a
  # branch without inventing a pull request to carry it.
  workflow_dispatch:

  pull_request:
    paths:
      - 'v1/**'
      - 'schema/**'
      - 'scripts/**'
      - 'config/**'
      - 'manual_overrides/**'
      - '.github/workflows/validate-pr.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/requirements.txt'

      - name: Install dependencies
        run: uv pip install --system -r scripts/requirements.txt

      - name: Run tests
        run: python -m pytest scripts/tests

      - name: Validate v1/
        run: python scripts/validate.py v1/
