name: Refresh asset profiles

on:
  schedule:
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      no_etfs:
        description: 'Skip ETF pass (stocks only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Sized for the slowest supported configuration rather than the expected
    # one: a cold `.http_cache` and no `OPENFIGI_API_KEY` costs about 39
    # minutes of ISIN typing on top of a ~17 minute cold ETF pass. With the
    # key the same run is under 20 minutes. An optional secret being unset
    # must not kill the job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/requirements*.txt'

      - name: Install dependencies
        run: uv pip install --system -r scripts/requirements.txt

      # The issuer-holdings fallback is optional and lives in its own file, so
      # the documented dev setup installs on Python past 3.12. This job pins
      # 3.12, where etf-scraper's numpy<2.0 ceiling still has a wheel, so the
      # build keeps the fallback it has always had.
      - name: Install the issuer-holdings fallback
        run: uv pip install --system -r scripts/requirements-issuer.txt

      # EDGAR answers 403 to a request whose User-Agent carries no real name
      # and email. Left as a secret rather than committed: it is a contact
      # address in a public repository, and it differs per fork.
      #
      # If the secret is missing or blank the build exits 2 in the first few
      # seconds rather than running. That is deliberate -- `sources.edgar`
      # degrades a failed fetch to an empty ticker mapping, so without the
      # check this job would resolve no CIK, reap every ETF shard, pass the
      # validator on the remains, and push a stocks-only dataset.
      # OpenFIGI types every published ISIN so that a structured certificate
      # stops claiming a sector and a record stops being keyed by another
      # company's identifier. `.http_cache/` is not persisted here, so every
      # run pays for the sweep cold, and the tier decides whether it fits the
      # timeout above: unauthenticated is 10 jobs per request at 25 requests a
      # minute, about 39 minutes for 9,400 ISINs, and a free key is 100 jobs
      # at 250 a minute, under one. The secret is optional and the timeout is
      # sized for its absence, so a missing key costs wall-clock rather than a
      # killed job or a wrong dataset.
      - name: Build dataset
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          if [ "${{ inputs.no_etfs }}" = "true" ]; then
            python scripts/build.py --no-etfs
          else
            python scripts/build.py
          fi

      - name: Validate
        run: python scripts/validate.py v1/

      - name: Commit & push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profiles"
          file_pattern: "v1/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
